# Copy to .github/workflows/nibble-fix.yml. Experimental: a maintainer starts it for one
# pull request (Actions tab → Nibble Fix → Run workflow) and reviews the pushed commit
# before merging. Don't trigger it automatically on dependency updates or pair it with
# auto-merge; see the README's Fixer section.
# Secrets: OPENCODE_API_KEY, NIBBLE_APP_CLIENT_ID, NIBBLE_APP_PRIVATE_KEY (an App with
# only Contents and Pull requests write).
name: Nibble Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to fix
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nibble-fix-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - id: fix
        uses: adlrocha/nibble-review/fix@v1
        with:
          pr-number: ${{ inputs.pr_number }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          app-client-id: ${{ secrets.NIBBLE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NIBBLE_APP_PRIVATE_KEY }}
          verify: |
            npm run lint
            npm test

      - name: Report when the fixer gives up
        if: steps.fix.outputs.result == 'gave-up'
        env:
          PR: ${{ inputs.pr_number }}
          REASON: ${{ steps.fix.outputs.reason }}
        run: |
          echo "::warning::Nibble Fix gave up on PR $PR: $REASON"
