# Copy to .github/workflows/nibble-fix.yml. Fixes Dependabot PRs whose CI failed.
# Secrets: OPENCODE_API_KEY, BOT_APP_CLIENT_ID, BOT_APP_PRIVATE_KEY. Add them to the
# Dependabot secret store too, because Dependabot-triggered runs only see that store.
name: Nibble Fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'dependabot/') && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nibble-fix-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - id: fix
        uses: adlrocha/nibble-review/fix@v1
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          app-client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          verify: |
            npm run lint
            npm test

      - name: Ask for a human when the fixer gives up
        if: steps.fix.outputs.result == 'gave-up'
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REASON: ${{ steps.fix.outputs.reason }}
        run: |
          echo "::warning::Nibble Fix gave up on PR $PR: $REASON"
