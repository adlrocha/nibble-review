name: Nibble Review (legacy)

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to review.
        required: true
        type: string
      trigger_comment_id:
        description: Issue comment ID that requested the review. Leave empty for manual or non-comment triggers.
        required: false
        type: string
        default: ""
      npm_install:
        description: Install repository dependencies before review.
        required: false
        type: boolean
        default: false
      runner:
        description: Runner label used for the review job.
        required: false
        type: string
    secrets:
      NIBBLE_REVIEW_PRIVATE_KEY:
        description: GitHub App private key used to author review comments.
        required: true
      OPENCODE_API_KEY:
        description: OpenCode Go API key.
        required: true
      CONTEXT7_API_KEY:
        description: Optional Context7 API key for higher rate limits.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  agent:
    runs-on: "${{ inputs.runner || 'ubuntu-latest' }}"
    container:
      # The pre-AML command surface is coupled to this frozen image.
      image: ${{ vars.REVIEW_LEGACY_IMAGE || 'ghcr.io/we-are-singular/nibble-review:legacy' }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      COMMENT_ID: ${{ inputs.trigger_comment_id }}
      TRIGGER_COMMENT_ID: ${{ inputs.trigger_comment_id }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-flash' }}
      OPENCODE_MODEL_FALLBACK: ${{ vars.OPENCODE_MODEL_FALLBACK || 'opencode-go/deepseek-v4-flash' }}
      OPENCODE_GATE_MODEL: ${{ vars.OPENCODE_GATE_MODEL || 'opencode-go/deepseek-flash' }}
      NIBBLE_REVIEW_INSTALL_DEPS: ${{ inputs.npm_install }}
    steps:
      - name: Run review guard
        id: review-guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2; do
            echo "review_guard attempt ${attempt}/2"
            if /usr/local/bin/review_guard; then
              exit 0
            else
              status=$?
            fi

            echo "::warning::review_guard attempt ${attempt}/2 failed with status ${status}"
            if [ "$attempt" -eq 2 ]; then
              exit "$status"
            fi
          done

      - name: Create GitHub App token
        if: steps.review-guard.outputs.should_review == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID || 'Iv23liVgvy1yaHapd0Wx' }}
          private-key: ${{ secrets.NIBBLE_REVIEW_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Acknowledge review request
        if: steps.review-guard.outputs.should_review == 'true'
        id: review-request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: /usr/local/bin/review_ack

      - name: Checkout repository
        if: steps.review-request.outputs.should_review == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Trust checkout directory
        if: steps.review-request.outputs.should_review == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout PR head
        if: steps.review-request.outputs.should_review == 'true'
        run: gh pr checkout "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Provision review workspace
        if: steps.review-request.outputs.should_review == 'true'
        run: /usr/local/bin/provision.sh

      - name: Run Nibble Review
        if: steps.review-request.outputs.should_review == 'true'
        timeout-minutes: 42
        run: timeout 40m /usr/local/bin/review_runner
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}

      - name: Extract review outputs and telemetry
        if: always() && steps.review-request.outputs.should_review == 'true'
        run: /usr/local/bin/review_extract --github-summary
