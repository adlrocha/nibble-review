# Low-noise updates: at most one security PR, one minor/patch PR, and one major PR per
# ecosystem each month. Security updates open as soon as an advisory lands and skip the
# cooldown; version updates wait a week after a release, which keeps most hijacked
# releases (usually yanked within days) out. Every PR is merged by a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
