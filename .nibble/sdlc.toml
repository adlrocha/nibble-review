# Read by nibble-review from the default branch, and by `nibble land` and `nibble sdlc`.
[land]
mode = "shadow" # "off", "shadow" (decide and report) or "enforce" (also merge)
# "side-project", "standard" or "critical": how much merges without a person
profile = "critical"
authors = ["adlrocha"]
required_checks = ["test", "sandbox"]
# true when main deploys to dev and a release deploys to production
main_is_staging = false
# The reviewer decides what merges everywhere, so its trust boundaries stay with a person.
always_human = [
  "src/lib/land.ts",
  "src/lib/review-queue.ts",
  "src/lib/review-authorship.ts",
  "src/lib/review-gate.ts",
  "src/cli/land.ts",
  "src/components/phases",
  "src/instructions",
  "src/review.tsx",
  "src/services/github",
  "src/tools",
  "src/services/review-preflight.ts",
  "src/services/review-evidence.ts"
]
